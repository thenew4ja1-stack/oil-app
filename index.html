<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Oil Change App</title>

<style>
body {font-family:sans-serif;background:#0f172a;color:#e2e8f0;margin:0;}
.container{max-width:900px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:20px;margin-top:15px;border-radius:12px;}
input,select{padding:10px;margin:5px;border-radius:8px;border:none;background:#334155;color:white;}
button{padding:10px 15px;background:#38bdf8;border:none;border-radius:6px;cursor:pointer;}
table{width:100%;margin-top:15px;border-collapse:collapse;}
td,th{padding:10px;text-align:center;border-bottom:1px solid #334155;}
th{color:#38bdf8;}
.btn-del{background:red;color:white;}
.btn-edit{background:orange;color:white;}
.alert{background:#ef4444;padding:10px;border-radius:8px;margin-top:10px;}
</style>
</head>

<body>
<div class="container">

<h2>🛢️ Oil Change System</h2>

<div id="alertBox"></div>

<div class="card">
<input id="car" placeholder="ชื่อรถ">
<input id="liter" type="number" placeholder="กี่ลิตร">
<input id="oilName" placeholder="ชื่อน้ำมันเครื่อง">
<input id="km" type="number" placeholder="เปลี่ยนที่กิโล">
<input id="nextKm" type="number" placeholder="ระยะ (เช่น 5000)">
<input type="date" id="date">

<br>
<input id="currentKm" type="number" placeholder="กิโลปัจจุบัน" oninput="checkAlert()">

<button onclick="add()">💾 บันทึก</button>
</div>

<div class="card">
<select id="filterCar" onchange="render();checkAlert()"></select>

<table>
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ลิตร</th>
<th>น้ำมัน</th>
<th>กม.</th>
<th>ถึงรอบ</th>
<th>จัดการ</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>
let db = JSON.parse(localStorage.getItem("oilAppDB")) || [];
let editIndex = -1;

function init(){
    date.valueAsDate = new Date();
    renderCarList();
    render();
}

function save(){
    localStorage.setItem("oilAppDB", JSON.stringify(db));
}

function add(){
    let obj = {
        car: car.value,
        liter: +liter.value,
        oil: oilName.value,
        km: +km.value,
        next: +nextKm.value,
        nextTotal: +km.value + +nextKm.value,
        date: date.value
    };

    if(editIndex === -1){
        db.push(obj);
    } else {
        db[editIndex] = obj;
        editIndex = -1;
    }

    save();
    render();
    renderCarList();
    resetForm();
}

function resetForm(){
    car.value="";
    liter.value=0;
    oilName.value="";
    km.value=0;
    nextKm.value=0;
}

function del(i){
    db.splice(i,1);
    save();
    render();
    renderCarList();
}

function edit(i){
    let d = db[i];

    car.value = d.car;
    liter.value = d.liter;
    oilName.value = d.oil;
    km.value = d.km;
    nextKm.value = d.next;
    date.value = d.date;

    editIndex = i;
}

function renderCarList(){
    let cars = [...new Set(db.map(d => d.car))];

    let html = `<option value="">-- เลือกรถ --</option>`;
    cars.forEach(c=>{
        html += `<option value="${c}">${c}</option>`;
    });

    filterCar.innerHTML = html;
}

function render(){
    table.innerHTML="";

    let selectedCar = filterCar.value;
    let data = db;

    if(selectedCar){
        data = db.filter(d => d.car === selectedCar);
    }

    data.sort((a,b)=> new Date(a.date) - new Date(b.date));

    data.forEach((d,i)=>{
        table.innerHTML += `
        <tr>
        <td>${d.date}</td>
        <td>${d.car}</td>
        <td>${d.liter}</td>
        <td>${d.oil}</td>
        <td>${d.km}</td>
        <td>${d.nextTotal}</td>
        <td>
            <button class="btn-edit" onclick="edit(${i})">✏️</button>
            <button class="btn-del" onclick="del(${i})">ลบ</button>
        </td>
        </tr>`;
    });
}

function checkAlert(){
    let selectedCar = filterCar.value;
    let current = +currentKm.value;

    if(!selectedCar || !current) return;

    let carData = db.filter(d => d.car === selectedCar);
    if(carData.length === 0) return;

    let last = carData[carData.length-1];

    if(current >= last.nextTotal){
        alertBox.innerHTML = `<div class="alert">⚠️ ถึงเวลาเปลี่ยนน้ำมัน (${selectedCar})</div>`;
    } else {
        alertBox.innerHTML = "";
    }
}

init();
</script>

</body>
</html>
